# ---------------------------------------------------------------
# HostelHub on Render (Blueprint)
#
# How to use:
#   1. Push this repository to GitHub.
#   2. In the Render dashboard choose  New -> Blueprint  and connect the repo.
#   3. Render reads this file and asks you for every variable marked
#      "sync: false" (secrets are never stored in Git). Paste them in.
#   4. Click Apply. Later pushes to `main` redeploy automatically.
#
# Full walkthrough: docs/deployment.md ("Deploying on Render").
# ---------------------------------------------------------------
services:
  - type: web
    name: hostelhub
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOSTELHUB_ENV
        value: production
      # Render generates a random value once and keeps it between deploys.
      - key: HOSTELHUB_SECRET_KEY
        generateValue: true
      - key: SUPABASE_BUCKET
        value: complaint-photos
      # Secrets and project-specific values: paste them in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FIREBASE_CLIENT_CONFIG
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% macro error_body() %}
  <div class="text-center py-5">
    <div class="error-code mb-2">{{ code }}</div>
    <h2 class="mb-2">{{ title }}</h2>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-2"></i>Go to home</a>
  </div>
{% endmacro %}

{% block content %}{{ error_body() }}{% endblock %}
{% block public_content %}<div class="error-page">{{ error_body() }}</div>{% endblock %}
